name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every step here is mirrored 1:1 by scripts/ci-local.sh (make ci).
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck and Zsh
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh

      - name: Lint (bash -n, zsh -n, shellcheck)
        run: make lint

      - name: Check runtime dependency probes
        run: make check

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # The script needs bash 4+; macOS ships 3.2 as /bin/bash.
      - name: Install ShellCheck and Bash (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install shellcheck bash

      - name: Run tests
        run: bash --version | head -1 && make test
